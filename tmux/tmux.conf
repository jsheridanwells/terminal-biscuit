# ════════════════════════════════════════════════════════════════════════════
#  tmux.conf — cross-platform (Linux/Wayland + macOS)
#  Repo path: tmux/tmux.conf  →  installs to ~/.config/tmux/tmux.conf
# ════════════════════════════════════════════════════════════════════════════

# ─── General ──────────────────────────────────────────────────────────────────
set -g escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g aggressive-resize on
set -g automatic-rename off

# Extended (kitty-protocol) keys so Ctrl+Shift+<key>, Ctrl+., Ctrl+` etc.
# survive the trip through tmux to nvim. Two independent settings are needed:
#   1. extended-keys always       → tmux forwards the extended encoding to nvim.
#   2. the extkeys terminal-feature → tmux negotiates extended-key reporting with
#      the OUTER terminal (Alacritty) so it emits those keys in the first place.
#
# Both machines run Alacritty, set to report TERM=xterm-256color (see
# alacritty.toml [env]), so this is now fully OS-agnostic — the old per-OS
# foot/iTerm2 branch is gone. (Truecolor is handled by the *:RGB line below.)
#
# IMPORTANT: extended-key negotiation happens when a client ATTACHES, not on
# config reload. After changing this you MUST fully restart:  tmux kill-server
# — a  prefix + r  / source-file will re-read the file but will NOT re-run the
# handshake, so the keys will still look dead.
set -s extended-keys always
set -as terminal-features 'xterm-256color:extkeys'

# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-keys C-a

# ─── Key bindings ───────────────────────────────────────────────────────────────
# reload config in-place
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# kill pane / window without confirmation
bind x kill-pane
bind X kill-window

# splits — open in current working directory
unbind %
unbind '"'
bind -  split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# new window in current working directory
bind c new-window -c "#{pane_current_path}"

# pane navigation: prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize: prefix + arrow key (10 cells at a time)
bind Up    resize-pane -U 10
bind Down  resize-pane -D 10
bind Left  resize-pane -L 10
bind Right resize-pane -R 10

# window switching, no prefix
bind -n S-Left  previous-window
bind -n S-Right next-window

# ─── Vim-aware pane navigation (vim-tmux-navigator) ─────────────────────────────
# Defines $is_vim, reused by the resizer block below — keep this block first.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ─── Vim-aware pane resize (better-vim-tmux-resizer) ────────────────────────────
# Reuses $is_vim from the navigator block above.
bind -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 10"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 10"

bind -T copy-mode-vi M-h resize-pane -L 10
bind -T copy-mode-vi M-j resize-pane -D 5
bind -T copy-mode-vi M-k resize-pane -U 5
bind -T copy-mode-vi M-l resize-pane -R 10

# ─── Copy mode ────────────────────────────────────────────────────────────────
setw -g mode-keys vi

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard tool differs by OS: wl-copy (Wayland) vs pbcopy (macOS).
if-shell 'test "$(uname -s)" = Darwin' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
}

# enter copy mode on scroll up
bind -n WheelUpPane if-shell -F "#{alternate_on}" \
    "send-keys -M" \
    "if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# paste: prefix + Ctrl-v
bind C-v paste-buffer

# ─── Appearance ───────────────────────────────────────────────────────────────
set -g status-style             "bg=#1a1b26,fg=#a9b1d6"
set -g message-style            "bg=#1a1b26,fg=#e0af68"
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g mode-style               "bg=#3b4261,fg=#c0caf5"  # copy-mode highlight

# ─── Status bar ───────────────────────────────────────────────────────────────
set -g status-interval  5
set -g status-position  bottom
set -g status-left-length  30
set -g status-right-length 60

# left: session name
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7] "

# window list
set -g window-status-separator      ""
set -g window-status-format         "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W#[fg=#e0af68]* "

# right: hostname  |  date  |  24h clock
set -g status-right \
    "#[fg=#565f89]#{host}  #[fg=#a9b1d6]%d-%m-%Y  #[fg=#7aa2f7,bold]%H:%M"

# ── handrolled nordic theme
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# ── Nord theme ──────────────────────────────────────────────
set -g status-style "bg=#2e3440,fg=#d8dee9"

# Left: session name
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold] #S #[bg=#2e3440] "
set -g status-left-length 30

# Windows
set -g window-status-format "#[fg=#4c566a] #I:#W "
set -g window-status-current-format "#[bg=#3b4252,fg=#88c0d0,bold] #I:#W "
# Make window numbers match the keyboard (1 is the leftmost key, not 0)
set -g base-index 1
setw -g pane-base-index 1

# Right: date + time (mirrors your Waybar format)
set -g status-right "#[fg=#4c566a] %a %b %d #[fg=#88c0d0] %I:%M %p "
set -g status-right-length 50

# Pane borders
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Messages / copy-mode
set -g message-style "bg=#3b4252,fg=#eceff4"
set -g mode-style "bg=#88c0d0,fg=#2e3440"

# Sway-style: prefix + Shift+N sends the current pane to window N
bind '!' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 1"
bind '@' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 2"
bind '#' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 3"
bind '$' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 4"
bind '%' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 5"
bind '^' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 6"
bind '&' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 7"
bind '*' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 8"
bind '(' run-shell "~/.config/tmux/move-pane.sh '#{pane_id}' '#{session_name}' 9"

