# ════════════════════════════════════════════════════════════════════════════
#  alacritty.toml — cross-platform (Linux/Wayland + macOS)
#  Repo path: alacritty/alacritty.toml  →  installs to ~/.config/alacritty/
#
#  Translated 1:1 from the old foot.ini, plus CSI-u key bindings (bottom) that
#  carry Ctrl+Shift+E / Ctrl+. / Ctrl+` through tmux to nvim — tmux can't
#  negotiate Alacritty's keyboard protocol, so we emit those sequences directly.
# ════════════════════════════════════════════════════════════════════════════

[general]
# Nord palette lives in its own file so the theme stays swappable.
# Home-relative path works whether deployed by setup.sh (copy) or link.sh (symlink).
import = ["~/.config/alacritty/nord.toml"]

[env]
# Deliberately boring. Alacritty's native TERM=alacritty needs its terminfo
# entry installed — present on Arch, MISSING on stock macOS (→ "unsuitable
# terminal" log noise). We live inside tmux (which sets tmux-256color
# internally) and truecolor comes from tmux's *:RGB line, so the outer TERM is
# nearly cosmetic. xterm-256color exists everywhere and keeps both machines
# identical and quiet.
TERM = "xterm-256color"

[font]
size = 9.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[selection]
# = foot's  selection-target=clipboard
save_to_clipboard = true

[[keyboard.bindings]]
# = foot's  clipboard-paste=Control+v
# Note: this shadows nvim's visual-block (Ctrl+V), exactly as the old foot
# binding did. Delete this block to get block-select back (paste reverts to
# the default Ctrl+Shift+V).
key = "V"
mods = "Control"
action = "Paste"

# ── Extended-key passthrough for tmux ────────────────────────────────────────
# nvim distinguishes Ctrl+Shift+E / Ctrl+. / Ctrl+` from their plain forms via
# the Kitty keyboard protocol. Alacritty speaks it natively (that's why these
# work OUTSIDE tmux) — but tmux only partially implements it and can't turn it
# on for Alacritty, so inside tmux those combos collapse to their legacy,
# indistinguishable bytes and the nvim mappings never fire.
#
# Fix: emit the CSI-u escape sequences ourselves, unconditionally. tmux passes
# the bytes straight through and nvim decodes them the same in or out of tmux —
# nothing to negotiate, nothing to un-negotiate.
#
# Sequence format:  ESC [ <keycode> ; <modifiers> u
#   keycode   = unicode codepoint of the BASE key   (e=101, .=46, `=96)
#   modifiers = 1 + Shift(1) + Alt(2) + Ctrl(4)      → Ctrl=5, Ctrl+Shift=6
# NOTE: TOML only allows \u escapes, never \x — \u001b is ESC.

[[keyboard.bindings]]
key = "E"
mods = "Control|Shift"
chars = "\u001b[101;6u"   # <C-S-e>  → neo-tree toggle

[[keyboard.bindings]]
key = "."
mods = "Control"
chars = "\u001b[46;5u"    # <C-.>    → LSP code action

[[keyboard.bindings]]
key = "`"
mods = "Control"
chars = "\u001b[96;5u"    # <C-`>    → toggle terminal
